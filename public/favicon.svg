<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0d1730"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eaf4ff"/>
      <stop offset="100%" stop-color="#2f7ff0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- faint radar rings -->
  <g stroke="#3f7fd6" fill="none" opacity="0.35">
    <circle cx="100" cy="62" r="22" stroke-width="1"/>
    <circle cx="100" cy="62" r="38" stroke-width="1"/>
    <circle cx="100" cy="62" r="54" stroke-width="1"/>
  </g>

  <!-- outer glowing ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#2f7ff0" stroke-width="5" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#8fc3ff" stroke-width="1.5"/>

  <!-- beam cone -->
  <g filter="url(#glowSoft)">
    <line x1="100" y1="46" x2="63" y2="118" stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="46" x2="137" y2="118" stroke="url(#beam)" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="44" x2="100" y2="122" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- sensor module -->
  <rect x="90" y="26" width="20" height="24" rx="4" fill="#12203f" stroke="#8fc3ff" stroke-width="2" filter="url(#glowSoft)"/>
</svg>
